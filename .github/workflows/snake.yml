name: Generate Snake Contribution Graph

on:
  schedule:
    # UTC基準。毎日00:00(UTC)= 日本時間 朝9:00に実行
    - cron: "0 0 * * *"
  workflow_dispatch: {}  # Actionsタブから手動実行できるようにする
  push:
    branches:
      - main  # mainへのpush時にも動かして即確認できるようにする

permissions:
  contents: write  # outputブランチへのpushに書き込み権限が必要

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 公式リポジトリ Platane/Platane の main.yml と同じ構成
      # (https://github.com/Platane/Platane/blob/master/.github/workflows/main.yml で構文確認済み)
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yss19411208
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # dist/ の内容を output ブランチへpushする
      # push後、https://raw.githubusercontent.com/yss19411208/yss19411208/output/<ファイル名> でアクセス可能になる
      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
