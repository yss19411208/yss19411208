name: Update Profile Cards

on:
  schedule:
    # UTC基準。毎日0時(UTC)= 日本時間 朝9時に実行
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # Actionsタブから手動実行できるようにする
  push:
    branches:
      - main              # このファイルをmainにpushした直後にも動かして確認できるようにする

permissions:
  contents: write         # 生成したSVGをリポジトリへコミットするために必要

# 同じワークフローの実行が重なった場合、後から始まった方を待たせる。
# (schedule / workflow_dispatch / push の3トリガーがあるため、
#  手動実行とpushがほぼ同時に起きるとpush競合が発生しうる)
concurrency:
  group: update-profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- 統計カード / 言語カードを静的SVGとして生成 ----
      # 公式 anuraghazra/github-readme-stats の README が案内している
      # readme-tools/github-readme-stats-action を利用する。
      # (情報源: https://github.com/anuraghazra/github-readme-stats)
      # 注意点: username は github.repository_owner から自動取得されるため
      #        ハードコードしていない(リポジトリ名変更時も追従できる)。
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=7FD6FF&icon_color=7FD6FF&text_color=c9d1d9'
          path: profile/stats.svg
          # GITHUB_TOKEN はこのリポジトリへの読み書き専用で、read:user のような
          # アカウント全体のコントリビューションデータを読むスコープを持たないため、
          # read:user スコープ付きの個人アクセストークン(Settings > Secrets に STATS_PAT として登録)を使う。
          token: ${{ secrets.STATS_PAT }}

      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&bg_color=0d1117&title_color=7FD6FF&text_color=c9d1d9&langs_count=8'
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}

      # ---- コントリビューションスネークを生成 ----
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-contribution-grid-snake.svg
            profile/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ---- 変更があれば1コミットにまとめてpush ----
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          # 変更が無い場合は git commit がエラーで終了するため || exit 0 で握りつぶす
          git commit -m "chore: update profile cards" || exit 0

          # push直前に最新のリモート状態を取り込んでから積み直す。
          # 対象は生成し直せば同じ結果になる使い捨てのSVGファイルのみなので、
          # rebaseで安全に解決できる想定。
          git pull --rebase origin main

          git push
